plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
    id 'maven-publish'
    id "me.modmuss50.mod-publish-plugin" version "1.1.0"
    id 'io.github.juuxel.loom-quiltflower' version '1.7.1'
}

version = "${project.mod_version}+${project.minecraft_base_version}"
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    maven { url = "https://maven.terraformersmc.com/" }
    maven { url = "https://maven.ladysnake.org/releases" }
    maven { url 'https://oss.sonatype.org/content/repositories/snapshots' }
    maven { url "https://maven.wispforest.io/releases" }
    maven { url 'https://maven.nucleoid.xyz' }
}

dependencies {
    //to change the versions see the gradle.properties file
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"

    // Fabric API. This is technically optional, but you probably want it anyway.
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

//    compileOnly "dev.emi:trinkets:${project.trinkets_version}"
//    implementation "dev.onyxstudios.cardinal-components-api:cardinal-components-base:${project.cca_version}"
//    implementation "dev.onyxstudios.cardinal-components-api:cardinal-components-entity:${project.cca_version}"

    compileOnly "com.terraformersmc:modmenu:${project.modmenu_version}"
    implementation include("xyz.nucleoid:server-translations-api:${project.server_translations_version}")
    implementation include("eu.pb4:sgui:${project.sgui_version}")
//    implementation annotationProcessor ("io.wispforest:owo-lib:${project.owo_version}")
//    include "io.wispforest:owo-sentinel:${project.owo_version}"

    compileOnly "me.lucko:fabric-permissions-api:${project.permission_api_version}"
}

publishMods {
    file = jar.archiveFile
    type = STABLE
    changelog = providers.environmentVariable("CHANGELOG").getOrElse("No changelog provided")

    displayName = "deathlog ${version.get()}"

    github {
        accessToken = providers.environmentVariable("GITHUB_TOKEN")
        repository = providers.environmentVariable("GITHUB_REPOSITORY").getOrElse("DrexHD/deathlog")
        commitish = providers.environmentVariable("GITHUB_REF_NAME").getOrElse("main")
    }
}

processResources {
    inputs.property "version", project.version
    filteringCharset "UTF-8"

    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

def targetJavaVersion = 25
tasks.withType(JavaCompile).configureEach {
    // ensure that the encoding is set to UTF-8, no matter what the system default is
    // this fixes some edge cases with special characters not displaying correctly
    // see http://yodaconditions.net/blog/fix-for-java-file-encoding-problems-with-gradle.html
    // If Javadoc is generated, this must be specified in that task too.
    it.options.encoding = "UTF-8"
    if (targetJavaVersion >= 10 || JavaVersion.current().isJava10Compatible()) {
        it.options.release = targetJavaVersion
    }
}

java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    if (JavaVersion.current() < javaVersion) {
        toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
    // Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
    // if it is present.
    // If you remove this line, sources will not be generated.
    withSourcesJar()
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.archives_base_name}" }
    }
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
        }
    }

    repositories {

    }
}
